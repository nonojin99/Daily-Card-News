name: Publish evening reels

# 릴스 저녁 예약 게시(2026-10-23~): publish/evening/<오늘 KST>_*.json 을 차례로 게시한다. README '인스타그램 운영' · publish/evening/README.md
on:
  schedule:
    - cron: '7 12 * * *'   # 21:07 KST (예약 실행 지연이 있어 대개 21~22시)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish today's evening requests
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          EXPECT_SPORTS_USERNAME: ${{ vars.EXPECT_SPORTS_USERNAME || 'hannun.sports' }}
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          shopt -s nullglob
          files=(publish/evening/${d}_*.json)
          [ ${#files[@]} -eq 0 ] && { echo "no evening requests for $d"; exit 0; }
          fail=0
          for f in "${files[@]}"; do
            echo "== $f"
            REQUEST="$f" python3 .github/scripts/publish_ig.py || fail=1
          done
          exit $fail
