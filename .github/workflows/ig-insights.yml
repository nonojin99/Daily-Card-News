name: Instagram insights

# 인스타 게시물 성과(조회·도달·평균 시청 시간 등)를 모아 insights/ 에 커밋한다(2026-10-23~).
# 실행: 매일 10:30 KST · insights/request.txt 를 바꿔 push(세션에서 바로 확인할 때) · 수동 Run workflow
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '5 * * * *'   # 매시 5분 — 게시 24시간 스냅샷만(2026-10-27, SNAPSHOT_ONLY)
  push:
    branches: [main]
    paths: ['insights/request.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ig-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          SNAPSHOT_ONLY: ${{ github.event.schedule == '5 * * * *' && '1' || '' }}
        run: python3 .github/scripts/ig_insights.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights
          git diff --staged --quiet && exit 0
          git commit -m "chore: instagram insights [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
          done
          exit 1
