name: Kakao alert

# 카카오톡 '나에게 보내기' 알림(2026-10-29~, 사용자 요청) — .github/scripts/kakao_alert.py
# ① 아래 워크플로가 실패로 끝나면(같은 워크플로는 성공 전까지 6시간에 한 번)
# ② ops_check 의 '사용자 승인 대기'(새 항목 즉시) ③ ops_check [높음](20분 넘게 남으면)
# 루틴 push·워크플로 종료·매시 예약 때마다 확인한다. 같은 항목은 한 번만(상태는 actions/cache).
# 테스트: Actions → Kakao alert → Run workflow(test 에 보낼 문구).
# 토큰 자동 갱신: Secret KAKAO_SECRETS_PAT(이 저장소 Secrets 쓰기 권한 fine-grained PAT)가 있으면
# 만료 한 달 전 새 refresh token 을 KAKAO_REFRESH_TOKEN 에 저장, 없으면 알림에 '재발급 필요'를 붙인다.
on:
  workflow_run:
    workflows:
      - Build manifest
      - Instagram insights
      - Office art
      - Publish scheduled reels
      - Publish to Instagram
      - Pull briefs from Drive
      - Score alert
      - Score alert watchdog
      - Slot check
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'publish/**'
      - 'reels/**/*.review.json'
      - 'cards/**/review.json'
      - 'sports/reels/queue.json'
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '테스트로 보낼 문구(비우면 평소 점검)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kakao-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: kakao-state
          key: kakao-alert-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: kakao-alert-
      - name: Check and send
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_SECRETS_PAT: ${{ secrets.KAKAO_SECRETS_PAT }}
          MODE: ${{ github.event.inputs.test != '' && 'test' || 'run' }}
          TEST_MSG: ${{ github.event.inputs.test }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_TITLE: ${{ github.event.workflow_run.display_title }}
          STATE: kakao-state/state.json
        run: python3 .github/scripts/kakao_alert.py
