name: Score alert

# ⚾ 경기 결과 알림(2026-10-23~): 경기가 끝나면 AI 없이 KBO 공식 기록으로 점수 카드를 만들어 @hannun.sports 에 올린다.
# 15분마다 16:00~01:59 KST 확인(GitHub 예약 실행은 몇 분~수십 분 밀릴 수 있다). 끄기: 저장소 변수 SCORE_ALERT=off, 게시 없이 카드만: dry
on:
  schedule:
    - cron: '*/15 7-16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    env:
      SCORE_ALERT: ${{ vars.SCORE_ALERT || 'on' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check finished games
        id: chk
        run: python3 .github/scripts/score_alert.py --check
      - name: Install renderer
        if: steps.chk.outputs.has_new == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji >/dev/null 2>&1 || echo "::warning::font install failed"
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Card and publish
        if: steps.chk.outputs.has_new == '1'
        env:
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          EXPECT_SPORTS_USERNAME: ${{ vars.EXPECT_SPORTS_USERNAME || 'hannun.sports' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/score_alert.py
