name: Score alert

# 경기 결과 알림 → @hannun.sports 스토리(2026-10-23~): 경기가 끝나면 AI 없이 공식 기록(⚾ KBO · 🎮 LoL)으로 그날 결과판을 만들어 올린다.
# 2026-10-24: 15분 예약 실행이 한 번도 돌지 않아(GitHub 짧은 주기 예약은 자주 밀리거나 건너뛴다) → 경기 시간대에 하루 두 번 띄워
# 6시간 가까이 5분마다 지켜보는 방식으로 바꿨다. 예약이 30~60분 밀려도 그 시간대를 대부분 덮는다.
#   17:40 KST → 23:35 까지: KBO(평일 18:30·주말 14:00/17:00 경기는 주말 오후 일부 놓칠 수 있음 — 그날 밤 판에 함께 실린다)
#   01:40 KST → 07:35 까지: 롤드컵 등 새벽 경기
# 끄기: 저장소 변수 SCORE_ALERT=off, 게시 없이 카드만: dry · 지금 바로 3시간 지켜보기: sports/alerts/request.txt 를 바꿔 push
on:
  schedule:
    - cron: '40 8 * * *'
    - cron: '40 16 * * *'
  push:
    branches: [main]
    paths: ['sports/alerts/request.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    env:
      SCORE_ALERT: ${{ vars.SCORE_ALERT || 'on' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji >/dev/null 2>&1 || echo "::warning::font install failed"
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Watch and publish
        env:
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          EXPECT_SPORTS_USERNAME: ${{ vars.EXPECT_SPORTS_USERNAME || 'hannun.sports' }}
          WATCH_MIN: ${{ github.event_name == 'schedule' && '355' || '180' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/score_alert.py --watch "$WATCH_MIN"
