name: Score alert

# 경기 결과 알림 → @hannun.sports 스토리(2026-10-23~): 경기가 끝나면 AI 없이 공식 기록(⚾ KBO · 🎮 LoL)으로 그날 결과판을 만들어 올린다.
# 2026-10-24: 이 저장소의 예약 실행은 15분 주기여도 하루 1~2번, 몇 시간 늦게만 돈다(Pull briefs from Drive 기록으로 확인).
# 그래서 **이어 달리기**: 한 회차가 355분 동안 5분마다 지켜본 뒤 마지막 단계에서 자기 자신을 workflow_dispatch 로 다시 띄운다
# (GITHUB_TOKEN 으로도 workflow_dispatch 는 새 실행을 만든다). 아래 6시간 예약은 사슬이 끊겼을 때 다시 잇는 예비용.
# 2026-10-26: 시간대 릴스 게시(publish/slots·publish/evening)도 이 루프가 5분마다 확인해 올린다 — 예약 실행 지연(21:07 → 00:51) 때문.
# 종목은 sports/alerts/sources.json (KBO·LoL·MLB·축구 4대 리그·챔스·유로파, NBA·NFL 은 꺼 둠)
# 끄기: 저장소 변수 SCORE_ALERT=off, 게시 없이 카드만: dry · 지금 바로 3시간 지켜보기: sports/alerts/request.txt 를 바꿔 push
on:
  schedule:
    - cron: '40 2 * * *'
    - cron: '40 8 * * *'
    - cron: '40 14 * * *'
    - cron: '40 20 * * *'
  push:
    branches: [main]
    paths: ['sports/alerts/request.txt']
  workflow_dispatch:
    inputs:
      relay:
        description: '이어 달리기로 띄운 회차(사람이 누를 땐 비워 둔다)'
        required: false
        default: ''


permissions:
  contents: write
  actions: write   # 다음 회차를 스스로 띄우기(이어 달리기)

concurrency:
  group: score-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    env:
      SCORE_ALERT: ${{ vars.SCORE_ALERT || 'on' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji ffmpeg >/dev/null 2>&1 || echo "::warning::font install failed"
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
      - name: Watch and publish
        env:
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}
          # 게시 성공 카톡(2026-10-29~) — kakao.py
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_SECRETS_PAT: ${{ secrets.KAKAO_SECRETS_PAT }}
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          EXPECT_SPORTS_USERNAME: ${{ vars.EXPECT_SPORTS_USERNAME || 'hannun.sports' }}
          # 시간대 게시(07:30·12:10·18:40·21:07)도 이 루프가 한다(2026-10-26~, publish_slots.tick) — 본계정 릴스용
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WATCH_MIN: ${{ github.event_name == 'push' && '180' || '355' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/score_alert.py --watch "$WATCH_MIN"
      - name: Relay — 다음 회차 띄우기
        if: always() && env.SCORE_ALERT != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run score-alert.yml --ref main -f relay=1 || echo "::warning::relay dispatch failed — 예비 예약 실행이 이어받는다"
