name: Build manifest

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '.github/scripts/make_cards.js'   # 카드 굽기 규칙이 바뀌면 최근 카드를 지문 비교로 다시 굽는다
      - '.github/workflows/build-manifest.yml'   # 이 워크플로가 바뀌어도 한 번 다시 돈다
      - 'tools/make_reel.js'                     # 릴스 규칙이 바뀌면 최근 릴스를 지문 비교로 다시 만든다
  workflow_dispatch:
    inputs:
      cards_force:
        description: '인스타용 카드 이미지를 다시 구울 브리프 파일명 (예: 2026-10-17_daily-brief.html)'
        required: false
        default: ''

permissions:
  contents: write

# 실행을 한 줄로 세운다 — 무인 발행 push·Drive 수집·연속 실행이 겹치면 커밋 push 가 서로 밀려 실패했다(2026-10-18 #111).
# 대기 중 실행은 최신 하나만 남지만, 이 워크플로는 저장소 전체를 다시 보므로(카드는 지문 비교) 빠지는 일이 없다.
concurrency:
  group: build-manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 원격 이미지(ESA/Webb·ESA/Hubble)를 저장소로 받아 src 를 로컬 경로로 바꾼다.
      # 실패해도 빌드는 계속된다 — 그 이미지는 핫링크로 남는다.
      - name: Install Pillow (optional, for resizing)
        run: |
          python3 -m pip install --quiet --break-system-packages pillow \
            || python3 -m pip install --quiet pillow \
            || echo "::warning::Pillow install failed - images will be saved without resizing"

      - name: Localize remote images
        # 선택 기능이 기존 manifest 생성을 막지 않도록 — 이 스텝이 통째로 죽어도 다음 스텝은 돈다
        continue-on-error: true
        env:
          LOCALIZE_OUT: ${{ runner.temp }}/localized.txt
        run: python3 .github/scripts/localize_images.py

      # 낭독 원고(<details class="audio-script">)가 있는 브리프만 MP3 를 만들어 Releases 에 올리고
      # 브리프에 재생기를 넣는다. 키가 없거나 실패하면 건너뛴다 — 브리프는 그대로 보인다.
      - name: Make audio (Google TTS)
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          AUDIO_OUT: ${{ runner.temp }}/audio.txt
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 .github/scripts/make_audio.py

      # 카드용 AI 일러스트 — .cn 안 <p class="cn-img"> 가 있는 카드만, 사건·재난·정치 분야는 제외.
      # 키(GEMINI_API_KEY)가 없거나 실패하면 건너뛴다 — 카드는 정보 그림/글자 타일로 남는다.
      - name: Make card illustrations (Gemini)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}
          IMAGE_FORCE: ${{ github.event.inputs.cards_force }}
          GEN_OUT: ${{ runner.temp }}/gen.txt
        run: python3 .github/scripts/make_images.py

      # 메인 브리프를 인스타용 카드 이미지(1080×1350 JPG)로 굽는다 — app/cards.html 을 그대로 캡처.
      # 실패해도 다음 스텝은 돈다. 이미지가 없어도 앱의 '카드' 보기는 동작한다.
      - name: Make card images (Instagram)
        continue-on-error: true
        env:
          CARDS_OUT: ${{ runner.temp }}/cards.txt
          CARDS_TYPES: daily,ai,sports,science   # 인스타 코너: 메인 + 월 AI · 화 스포츠 · 일 과학 (금 숫자·토 주말은 묶음으로 자동)
          CARDS_FORCE: ${{ github.event.inputs.cards_force }}
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1 || echo "::warning::fonts-noto-cjk install failed"
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium >/dev/null
          node .github/scripts/make_cards.js

      # 오디오 릴스(1080×1920 MP4) — 인스타 게시일에 맞춘 브리프(ai·sports·science·activity, 토요일 music)의
      # 카드 + 낭독 MP3 를 문단 구간에 맞춰 엮는다. 3분이 넘으면 곁가지 문단을 통째로 뺀다. 사건·사고 카드가 있으면 만들지 않는다.
      # 재료(브리프·MP3·도구·렌더러)가 바뀌면 다시 만든다(.reel.json 의 fp). 실패해도 다음 스텝은 돈다.
      - name: Make audio reels (Instagram)
        continue-on-error: true
        env:
          REELS_OUT: ${{ runner.temp }}/reels.txt
        run: |
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || echo "::warning::emoji font install failed"
          node tools/make_reel.js --recent

      - name: Generate manifest.json
        shell: python
        run: |
          import json, os, re, datetime
          # 데일리 브리프:  YYYY-MM-DD_type-brief.html
          P = re.compile(r'^(\d{4})-(\d{2})-(\d{2})_([a-z]+)-brief\.html$', re.I)
          # 파운드리 주간:  파운드리_주간_NN_YYYYMMDD.html  (다운로드 중복 접미사 -1 허용)
          PF = re.compile(r'^파운드리_주간_(\d{2})_(\d{4})(\d{2})(\d{2})(?:-\d+)?\.html$')
          files, odd = [], []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              rel = os.path.relpath(root, '.')
              if rel != '.' and not re.fullmatch(r'\d{4}-\d{2}', rel):
                  continue
              for n in names:
                  if not n.lower().endswith(('.html', '.htm')):
                      continue
                  if n.lower().startswith('index'):
                      continue
                  path = n if rel == '.' else rel + '/' + n
                  m = P.match(n)
                  mf = PF.match(n)
                  if m:
                      files.append({
                          'date': m.group(1) + '-' + m.group(2) + '-' + m.group(3),
                          'month': m.group(1) + '-' + m.group(2),
                          'year': m.group(1),
                          'mon': m.group(2),
                          'day': m.group(3),
                          'type': m.group(4).lower(),
                          'path': path,
                      })
                  elif mf:
                      files.append({
                          'date': mf.group(2) + '-' + mf.group(3) + '-' + mf.group(4),
                          'month': mf.group(2) + '-' + mf.group(3),
                          'year': mf.group(2),
                          'mon': mf.group(3),
                          'day': mf.group(4),
                          'type': 'foundry',
                          'issue': int(mf.group(1)),
                          'path': path,
                      })
                  else:
                      odd.append(path)
          files.sort(key=lambda f: f['type'] != 'daily')
          files.sort(key=lambda f: f['date'], reverse=True)
          odd.sort()
          out = {
              'generated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'count': len(files),
              'files': files,
              'odd': odd,
          }
          with open('manifest.json', 'w', encoding='utf-8') as fp:
              json.dump(out, fp, ensure_ascii=False, indent=2)
              fp.write('\n')
          print('brief:', len(files), '/ odd:', len(odd))

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if [ -s "$RUNNER_TEMP/localized.txt" ]; then
            xargs -a "$RUNNER_TEMP/localized.txt" -d '\n' git add --
          fi
          if [ -s "$RUNNER_TEMP/audio.txt" ]; then
            xargs -a "$RUNNER_TEMP/audio.txt" -d '\n' git add --
          fi
          if [ -s "$RUNNER_TEMP/gen.txt" ]; then
            xargs -a "$RUNNER_TEMP/gen.txt" -d '\n' git add --
          fi
          if [ -s "$RUNNER_TEMP/cards.txt" ]; then
            xargs -a "$RUNNER_TEMP/cards.txt" -d '\n' git add --
          fi
          if [ -s "$RUNNER_TEMP/reels.txt" ]; then
            xargs -a "$RUNNER_TEMP/reels.txt" -d '\n' git add --
          fi
          git diff --staged --quiet || git commit -m "chore: update manifest.json, localize images, add audio, card images, reels [skip ci]"
          # 그사이 다른 push(브리프 발행 등)가 들어왔으면 그 위로 다시 얹어 최대 3번 시도
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected ($i) — rebase onto origin/main and retry"
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
