name: Publish to Instagram

# 사람이 보고 누르는 1탭 승인 게시. 정해진 시간 자동 실행(cron)은 없다.
# 실행 방법 ① publish/request.json 을 바꿔 push → 확인용(dry_run true)
#          ② Actions 탭 → Run workflow → 입력칸은 비우고 dry_run 만 false → 요청 파일 그대로 게시(승인 1탭)
on:
  push:
    branches: [main]
    paths: ['publish/request.json']
  workflow_dispatch:
    inputs:
      kind:
        description: '비우면 publish/request.json 값. reel 또는 carousel'
        required: false
        default: ''
      media:
        description: '비우면 요청 파일 값. 릴스 MP4 경로 또는 캐러셀 JPG 폴더 (예: cards/2026-10/2026-10-17_weekend)'
        required: false
      caption:
        description: '비우면 요청 파일 값. 캡션 파일 경로 (예: captions/2026-10-17_weekend.txt)'
        required: false
      dry_run:
        description: 'true 면 게시하지 않고 확인만'
        required: true
        default: 'true'
      is_ai:
        description: '비우면 요청 파일 값. AI 음성·그림 포함 표시(릴스)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_SPORTS_ACCESS_TOKEN: ${{ secrets.IG_SPORTS_ACCESS_TOKEN }}   # 스포츠 계정(요청 항목 "account":"sports")
          IG_SPORTS_USER_ID: ${{ secrets.IG_SPORTS_USER_ID }}
          EXPECT_SPORTS_USERNAME: ${{ vars.EXPECT_SPORTS_USERNAME || 'hannun.sports' }}
          KIND: ${{ github.event.inputs.kind }}
          MEDIA: ${{ github.event.inputs.media }}
          CAPTION: ${{ github.event.inputs.caption }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          IS_AI: ${{ github.event.inputs.is_ai }}
          REQUEST: publish/request.json
        run: python3 .github/scripts/publish_ig.py
