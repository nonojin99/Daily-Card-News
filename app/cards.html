<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>카드로 보기 — Daily Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
  /* 카드 넘겨보기 — 브리프 HTML 한 편을 4:5 카드(인스타 비율)로 다시 그린다.
     글자 크기는 카드 폭(cqw) 기준이라 ?png=1 로 1080px 폭에 그려도 비율이 같다(Actions 가 JPG 로 굽는다).
     그림 우선순위: .cn 안 <svg class="cn-v"> → 카드의 도표(figure.chart) → 정보 그림(.cn-place/.cn-when/.cn-num: 지도·달력·큰 숫자)
     → AI 생성 이미지(.cn img.cn-gen, Actions 가 만든다) → 분야 글자 타일. 보도사진은 쓰지 않는다. 2026-10-21~ 순서: 실제 이미지(figure.photo) → AI 이미지 → 도표·개념도 → 정보 그림 → 정보 시트. ?vis=info 면 AI 이미지를 건너뛴다. */
  :root{
    --page:#faf9f6; --card:#ffffff; --ink:#1a1a18; --muted:#55554f; --faint:#9a9a94; --line:#e6e4dd;
    --stage:#f3f1ea; --accent:#3d5a4c; --accent-soft:#eef2ee; --off:#cfcdc4;
    --s1:#2f6d9e; --s2:#c06a24;
    --sans:'Noto Sans KR','Apple SD Gothic Neo',sans-serif; --serif:'Noto Serif KR',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--page)}
  body{color:var(--ink);font-family:var(--sans);word-break:keep-all;overflow-wrap:anywhere}
  .wrap{max-width:520px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .state{padding:60px 0;text-align:center;color:var(--faint);font-size:14px;line-height:1.7}

  .rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:18px}
  .rail::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;container-type:inline-size;background:var(--card);
    border-radius:18px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
  .stage{flex:0 0 50%;background:var(--stage);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  .stage > svg,.stage .vis svg{width:90%;height:auto;display:block;position:relative;overflow:visible}
  .stage .vis{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.6cqw;position:relative}
  .vis-cap{font-size:2.9cqw;font-weight:700;color:var(--muted);letter-spacing:.02em;align-self:flex-start;margin-left:6cqw}
  .stage .tile{font-weight:900;color:var(--accent);font-size:13cqw;letter-spacing:-.04em;line-height:1.1;text-align:center;padding:0 8cqw}
  .stage .tile small{display:block;font-size:3.4cqw;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:2.4cqw}
  .stage img.gen{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .stage .ovb{position:absolute;left:0;right:0;bottom:0;padding:10cqw 6cqw 12cqw 6cqw;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.72) 45%);color:#fff;text-shadow:0 .3cqw 1.2cqw rgba(0,0,0,.45);z-index:1}
  .stage .ovb b{display:block;font-weight:900;font-size:10cqw;line-height:1.05;letter-spacing:-.03em}
  .stage .ovb small{display:block;font-size:3.3cqw;font-weight:700;margin-top:1cqw;opacity:.95}
  .stage .ovp{position:absolute;left:5.5cqw;bottom:12cqw;display:flex;gap:4.5cqw;align-items:flex-end;background:rgba(14,40,30,.86);color:#fff;padding:2.6cqw 4cqw 3cqw;border-radius:2.6cqw;box-shadow:0 .8cqw 3cqw rgba(0,0,0,.35);z-index:1}
  .stage .ovp small{display:block;font-size:2.9cqw;font-weight:500;opacity:.9}
  .stage .ovp b{display:block;font-weight:900;font-size:11cqw;line-height:1;letter-spacing:-.03em}.stage .ovp b.ac{color:#7ee0b5}
  .stage .phw{position:absolute;inset:0;display:flex;flex-direction:column;background:#0d1020}
  .stage .phw img{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;display:block}
  .stage .phb{flex:0 0 auto;padding:2.2cqw 3.6cqw 2.6cqw 22cqw;color:#fff;line-height:1.35}
  .stage .phb b{display:block;font-size:3cqw;font-weight:700;margin-bottom:.8cqw}
  .stage .phb small{display:block;font-size:2.45cqw;color:rgba(255,255,255,.72)}
  /* 그림 재료가 없을 때: 글자 타일 대신 카드의 스펙 표를 정보 시트로 */
  .stage .sheet{width:84%;display:flex;flex-direction:column;gap:2.4cqw}
  .stage .sheet div{display:grid;grid-template-columns:20cqw 1fr;gap:3cqw;align-items:baseline;padding-bottom:2.4cqw;border-bottom:1px solid var(--line)}
  .stage .sheet div:last-child{border-bottom:0}
  .stage .sheet b{font-size:3.2cqw;font-weight:700;color:var(--accent);letter-spacing:.02em}
  .stage .sheet span{font-size:3.6cqw;font-weight:500;color:var(--ink);line-height:1.4}
  .stage .ai{position:absolute;left:3.6cqw;top:3.6cqw;font-size:2.5cqw;font-weight:500;color:#fff;background:rgba(26,26,24,.55);padding:1cqw 2.4cqw;border-radius:99px;z-index:2}
  /* 정보 그림(지도·달력·큰 숫자) */
  .ig-land{fill:#dcd6ca;stroke:var(--stage);stroke-width:.6}
  .ig-pin{fill:var(--accent)} .ig-pinhole{fill:#fff} .ig-halo{fill:var(--accent);opacity:.15}
  .ig-pinlab{font:700 15px var(--sans);fill:var(--ink)}
  .ig-panel{fill:#fff} .ig-line{stroke:var(--line);stroke-width:1.5}
  .ig-k{font:500 14px var(--sans);fill:var(--muted)} .ig-s{font:500 13px var(--sans);fill:var(--muted)}
  .ig-big{font:900 34px var(--sans);fill:var(--ink);letter-spacing:-.02em}
  .ig-hero{font:900 92px var(--sans);fill:var(--accent);letter-spacing:-.04em}
  .ig-calh{font:500 11px var(--sans);fill:var(--faint)} .ig-on{fill:var(--accent)} .ig-off{fill:#fff}
  .ig-ct{font:500 12px var(--sans);fill:var(--muted)} .ig-ct.on{fill:#fff;font-weight:700}
  .ig-sea{fill:#e9eef0} .ig-land2{fill:#dcd6ca;stroke:var(--stage);stroke-width:.5} .ig-hl{fill:var(--accent);opacity:.6;stroke:var(--stage);stroke-width:.5}
  .ig-pinlab{paint-order:stroke;stroke:var(--stage);stroke-width:3px}
  .ig-msc{font:900 24px var(--sans);fill:var(--ink)} .ig-mteam{font:700 18px var(--sans);fill:var(--ink)} .ig-mteam.lo{fill:var(--faint);font-weight:500}
  .ig-score{font:900 84px var(--sans);fill:var(--ink);letter-spacing:-.03em} .ig-score .d{fill:var(--faint);font-weight:500}
  .ig-team{font:700 22px var(--sans);fill:var(--ink)}
  .ig-son{fill:var(--accent)} .ig-soff{fill:var(--off)}
  .ig-node{fill:var(--accent)} .ig-node2{fill:#fff;stroke:var(--accent);stroke-width:2}
  .ig-nodet{font:700 19px var(--sans);fill:var(--ink)} .ig-nodet.w,.ig-s.w{fill:#fff}
  .ig-arrow{stroke:var(--accent);stroke-width:3;fill:none} .ig-ah{fill:var(--accent)}
  .ig-pill{fill:#fff;stroke:var(--accent);stroke-width:1.5} .ig-pillt{font:700 13px var(--sans);fill:var(--accent)}
  .ig-mid{font:900 40px var(--sans);fill:var(--ink);letter-spacing:-.02em} .ig-mid.ac{font-size:36px;fill:var(--accent)}
  .ig-ghost{fill:none;stroke:var(--off);stroke-width:2} .ig-strike{font:700 20px var(--sans);fill:var(--faint);text-decoration:line-through}
  .ig-lvon{fill:var(--accent)} .ig-lvoff{fill:#fff} .ig-lvt{font:500 13px var(--sans);fill:var(--muted)} .ig-lvt.on{fill:#fff;font-weight:700}
  .ig-sline{stroke:var(--accent);stroke-width:3} .ig-sline.off{stroke:var(--off)} .ig-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.35}
  .ig-st{font:700 15px var(--sans);fill:var(--ink)} .ig-st.dim{fill:var(--faint)}
  .ig-b1{fill:var(--s1)} .ig-b2{fill:var(--s2)} .ig-bl{font:500 13px var(--sans);fill:var(--muted)} .ig-bv{font:700 14px var(--sans);fill:var(--ink)}
  .count{position:absolute;top:3.6cqw;right:3.6cqw;font-size:3cqw;font-weight:500;color:#fff;background:rgba(26,26,24,.62);padding:1.2cqw 2.8cqw;border-radius:99px;z-index:2}
  .badge{position:absolute;left:6cqw;top:calc(50% - 7cqw);width:14cqw;height:14cqw;border-radius:50%;background:var(--card);
    box-shadow:0 1.2cqw 3cqw rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:7cqw;color:var(--accent);z-index:2}
  .body{flex:1;padding:3cqw 7cqw 0;display:flex;flex-direction:column;min-height:0}
  .credit{align-self:flex-end;font-size:2.6cqw;color:var(--faint);margin-bottom:3cqw;max-width:70%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .label{font-size:3cqw;color:var(--faint);font-weight:500;margin-bottom:1.6cqw;letter-spacing:.02em}
  .label b{color:var(--accent);font-weight:700}
  .slide h2{font-size:7.2cqw;font-weight:900;line-height:1.22;letter-spacing:-.03em;margin-bottom:2.6cqw;text-wrap:balance}
  .slide h2.l{font-size:6.2cqw} .slide h2.xl{font-size:5.4cqw}
  .slide p{font-size:3.55cqw;line-height:1.62;color:var(--muted);letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .foot{margin-top:auto;display:flex;justify-content:space-between;padding:2.4cqw 0 3.4cqw;font-size:2.5cqw;color:var(--faint);letter-spacing:.08em}

  .cover{background:var(--accent);color:#f4f2ec}
  .cover .in{flex:1;padding:9cqw 8cqw 6cqw;display:flex;flex-direction:column;position:relative;min-height:0}
  /* 분야 이름 — 첫 방문자가 표지만 보고 무슨 코너인지 알게(2026-10-18). 그리드 3:4 자르기에도 남는 위쪽에 둔다 */
  .cover .cat{align-self:flex-start;font-size:4.4cqw;font-weight:900;letter-spacing:.02em;background:rgba(255,255,255,.16);color:#fff;padding:1.4cqw 3.4cqw;border-radius:99px;margin-bottom:3cqw}
  .cover .k{font-size:3cqw;letter-spacing:.24em;font-weight:700;opacity:.8;text-transform:uppercase}
  .cover .d{font-size:12cqw;font-weight:900;letter-spacing:-.03em;margin-top:3cqw;line-height:1}
  .cover .d small{font-size:4.2cqw;font-weight:500;letter-spacing:.12em;opacity:.75;margin-left:2cqw}
  .cover h2{font-size:6.6cqw;line-height:1.32;margin-top:7cqw;color:#fff}
  .cover .wx{margin-top:3cqw;font-size:3cqw;background:rgba(255,255,255,.1);border-radius:2cqw;padding:2cqw 3cqw;line-height:1.5}
  .cover ol{list-style:none;margin-top:auto;display:grid;gap:1.6cqw;font-size:3.3cqw}
  .cover li{display:flex;gap:2.6cqw;align-items:baseline;border-top:1px solid rgba(244,242,236,.22);padding-top:1.6cqw;min-width:0}
  .cover li em{font-style:normal;flex:0 0 auto;font-size:2.5cqw;font-weight:700;background:rgba(255,255,255,.2);padding:.4cqw 1.6cqw;border-radius:99px}
  .cover li b{font-size:3cqw;opacity:.7;min-width:3cqw}
  .cover li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* 표지 재료가 많은 날(긴 제목 + 날씨 + 목록 5개 이상) — 계정 줄이 밀려나지 않게 촘촘히 */
  .cover.dense .d{font-size:10cqw;margin-top:2cqw} .cover.dense h2{font-size:5.6cqw;margin-top:4.5cqw}
  .cover.dense .wx{margin-top:2.4cqw;padding:1.6cqw 3cqw} .cover.dense ol{gap:1.1cqw;font-size:3.1cqw} .cover.dense li{padding-top:1.1cqw}
  .cover .handle{margin-top:3cqw;font-size:3cqw;font-weight:700;opacity:.85;letter-spacing:.02em}
  .foot .h{font-weight:700;color:var(--accent);letter-spacing:.02em}
  .cover.end .follow{font-size:5.4cqw;font-weight:900;color:#fff;order:8}
  .cover.end .follow small{display:block;font-size:2.8cqw;font-weight:500;opacity:.7;margin-top:1.4cqw;letter-spacing:.02em}
  .cover.end .follow small.xlink{opacity:.95;font-weight:700;margin-top:1cqw}
  .cover.end{background:#1a1a18} .cover.end h2{margin-top:5cqw;font-size:5.8cqw}
  .cover.end ol{margin-top:5cqw;grid-template-columns:1fr 1fr;column-gap:4cqw;row-gap:0;font-size:2.9cqw}
  .cover.end ol.one{grid-template-columns:1fr;margin-top:3cqw;font-size:2.7cqw}
  .cover.end ol.one li{padding:.75cqw 0}
  .cover.end:has(ol.one) h2{margin-top:2.4cqw}
  .cover.end:has(ol.one) .wx{font-size:2.6cqw}
  .cover.end li{padding:1.4cqw 0}
  .cover.end .follow{margin-top:3.4cqw}
  /* 공유 유도(2026-10-23~) — DM 공유가 추천에 크게 반영된다는 진단. 출처 목록과 계정 사이, 브리프 액센트색 알약 */
  .cover.end .share{order:7;margin-top:auto;align-self:flex-start;background:var(--accent);color:#fff;font-weight:900;font-size:3.6cqw;padding:1.8cqw 3.8cqw;border-radius:99px;letter-spacing:-.01em}
  .cover.end .wx{margin-top:3cqw;order:9}

  /* 브리프 도표(figure.chart)를 그대로 옮긴다 — 카드 폭이 좁아 글자 user unit 을 키운다 */
  .cv-bar,.cv-bar.cv-s1,.cv-dot.cv-s1{fill:var(--s1)} .cv-bar.cv-s2,.cv-dot.cv-s2{fill:var(--s2)}
  .cv-line{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .cv-line.cv-s1{stroke:var(--s1)} .cv-line.cv-s2{stroke:var(--s2)}
  .cv-dot{stroke:var(--stage);stroke-width:2}
  .cv-grid,.cv-axis{stroke:#dcd9cf;stroke-width:1} .cv-zero,.cv-base{stroke:#b9b7ad;stroke-width:1}
  .cv-t,.cv-ax{font-family:var(--sans);font-size:20px;fill:var(--faint)}
  .cv-cat{font-family:var(--sans);font-size:21px;font-weight:500;fill:var(--muted)}
  .cv-val{font-family:var(--sans);font-size:22px;font-weight:700;fill:var(--ink)}
  .cv-mid{text-anchor:middle}
  .cv-stepdot{stroke:var(--stage);stroke-width:2} .cv-st-done,.cv-st-now{fill:var(--accent)} .cv-st-next{fill:var(--off)}
  .cv-step-done{stroke:var(--accent);stroke-width:2} .cv-steplab-ring{fill:none;stroke:var(--accent);stroke-width:1;opacity:.32}
  .cv-st-done-t,.cv-st-now-t{fill:var(--ink)} .cv-st-next-t{fill:var(--faint)}
  .cv-legend{display:flex;gap:4cqw;align-self:flex-start;margin-left:6cqw}
  .cv-legend span{display:inline-flex;align-items:center;gap:1.4cqw;font-size:2.7cqw;color:var(--muted)}
  .cv-legend i{width:4cqw;height:1cqw;border-radius:1cqw;display:inline-block}
  .cv-legend .k1 i{background:var(--s1)} .cv-legend .k2 i{background:var(--s2)}
  /* 카드 전용 그림(<svg class="cn-v" viewBox="0 0 400 220">) 어휘 — README '카드 넘겨보기' 절 */
  .cn-on{fill:var(--accent)} .cn-off{fill:var(--off)}
  .cn-line{stroke:var(--accent);stroke-width:3} .cn-line-off{stroke:var(--off);stroke-width:3}
  .cn-ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:.35}
  .cn-big{font:700 16px var(--sans);fill:var(--ink)} .cn-small{font:500 13px var(--sans);fill:var(--muted)}
  .cn-dim{fill:#7a7a73}
  .cn-q{font-family:var(--serif);font-weight:900;fill:var(--ink)} .cn-qm{font-family:var(--serif);font-weight:900;fill:var(--accent);opacity:.25}
  .cn-grid{stroke:#dcd9cf;stroke-width:1} .cn-ax{font:500 13px var(--sans);fill:var(--faint)}
  .cn-val{font:700 17px var(--sans);fill:var(--ink)} .cn-cat{font:500 15px var(--sans);fill:var(--muted)}
  .cn-b1{fill:var(--s1)} .cn-b2{fill:var(--s2)}
  .cn-ln{fill:none;stroke:var(--s1);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
  .cn-dot{fill:var(--s1);stroke:var(--stage);stroke-width:3}

  .nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
  .nav button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
  .nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .dots{display:flex;gap:6px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--off)}
  .dots i.on{background:var(--ink)}
  .saves{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
  .saves h3{font-size:14px;font-weight:700;margin-bottom:4px}
  .saves p{font-size:12.5px;color:var(--faint);margin-bottom:10px;line-height:1.6}
  .saves .all{display:block;width:100%;margin:6px 0 10px;padding:13px 0;border:0;border-radius:12px;background:var(--accent);color:#fff;font:700 15px var(--sans);cursor:pointer}
  .saves .all:disabled{opacity:.55;cursor:default}
  .saves .all.sub{background:var(--card);color:var(--accent);border:1.5px solid var(--accent);margin-top:-2px}
  .saves .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .saves img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block;background:var(--stage)}

  /* PNG 모드: Actions 가 1080px 폭으로 한 장씩 캡처한다 */
  html.png body{background:#fff}
  html.png .wrap{max-width:none;padding:0}
  html.png .rail{display:block;overflow:visible;border-radius:0}
  html.png .slide{width:1080px;border-radius:0;box-shadow:none}
  html.png .nav,html.png .saves{display:none}
  @media (prefers-reduced-motion:reduce){.rail{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="state">카드를 만드는 중…</div></div>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const F = qs.get("f") || "";
const PNG = qs.has("png");
if(PNG) document.documentElement.classList.add("png");
const WD = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean = s => String(s || "").replace(/\s+/g, " ").trim();
const wrap = document.getElementById("wrap");
const nb = h => String(h).replace(/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+/g, m => `<span style="white-space:nowrap">${m}</span>`);   // 이미 esc 된 문자열에만

// 카드용 제목: .cn-t(줄바꿈 <br> 허용) → 없으면 h2 의 " — " 앞부분
function titleOf(a){
  const t = a.querySelector(".cn .cn-t");

const CRC = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

      .forEach(([o, v, n]) => n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [42, off, 4]]
      .forEach(([o, v, n]) => n === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));

          return !(w && w.to && w.to < sat); };   // 토요일 전에 끝난 일정은 빼기
        const isAhead = a => a.dataset.plan === "ahead";
        // 미리 예약(다음 1~4주) — 이번 주말엔 늦지만 지금 예약해야 하는 것. 최대 2장, 묶음 맨 뒤
        const ahead = briefs.flatMap(b => b.arts.filter(a => isAhead(a) && !sensitive(a) && live(a, b)).map(a => ({a, b}))).slice(0, 2);
        const quota = ahead.length ? {activity: 3, travel: 2, culture: 1} : null;
        briefs.forEach(b => {
          const src = srcs.find(([d]) => d === b.date) || [], lim = quota ? (quota[src[1]] ?? 1) : (src[2] || 2);
          // data-weekend="pick" 카드(작성자가 '이번 주말에 가장 쓸모 있는 카드'로 고른 것)를 먼저, 나머지는 브리프 순서대로
          b.arts.filter(a => !sensitive(a) && !isAhead(a) && live(a, b)).sort((p, q) => (q.dataset.weekend === "pick") - (p.dataset.weekend === "pick"))
            .slice(0, lim).forEach(a => picks.push({a, b}));
        });
        picks.push(...ahead);
      }
    }else{
      if(!/^\d{4}-\d{2}-\d{2}_[a-z]+-brief\.html$/.test(F)) throw new Error("bad file");
      const b = await loadBrief(F); if(!b) throw new Error("not found");
      briefs = [b]; picks = b.arts.map(a => ({a, b}));
    }
    if(!picks.length) throw new Error("no cards");
    const main = briefs[0];
    document.documentElement.style.setProperty("--accent", main.ac);
    document.documentElement.style.setProperty("--accent-soft", main.acs);

    // 지도 데이터는 필요할 때만 — 국내 지명은 kr.json, 사전에 없는 이름(나라)이 있으면 world.json 도
    let geo = null;
    const ptoks = picks.flatMap(({a}) => clean(a.querySelector(".cn .cn-place")?.textContent).split(/\s*,\s*/).filter(Boolean).map(t => t.split("@").pop().trim()));
    if(ptoks.length){
      geo = {kr: await fetch("geo/kr.json").then(r => r.json()).catch(() => null), world: null};
      if(ptoks.some(t => !(geo.kr && geo.kr.places[t]))) geo.world = await fetch("geo/world.json").then(r => r.json()).catch(() => null);
    }
    const cards = picks.map(({a, b}) => ({
      pc: photoOf(a)?.credit || "", ahead: a.dataset.plan === "ahead", title: titleOf(a), sum: summaryOf(a), credit: creditOf(a), num: titleNum(a), vis: visualOf(a, geo, Number(b.date.slice(0, 4))),
      label: clean(a.querySelector(".topic")?.textContent), ac: b.ac, acs: b.acs, date: b.date, ai: !!a.querySelector(".cn img.cn-gen")
    }));
    if(geo && geo.kr) document.body.insertAdjacentHTML("afterbegin", `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="kr" class="ig-land" d="${geo.kr.outline}"/></defs></svg>`);

    const D = MIX ? MD : F.slice(0, 10);
    const [y, m, d] = D.split("-");
    const wd = WD[new Date(`${y}-${m}-${d}T00:00:00`).getDay()];
    const N = cards.length + 2;   // 표지 + 카드 + 출처
    const kicker = series ? series.kicker : clean(main.doc.querySelector(".kicker")?.textContent).split("·")[0] || "Daily Brief";
    // 분야 이름 — 브리프 종류(파일명)로 정한다. 색만으로는 처음 온 사람이 코너를 구분하지 못한다
    const CAT = {daily: "오늘의 뉴스", ai: "AI·테크", sports: "스포츠", baseball: "⚾ 야구 나이트", football: "⚽ 축구 모닝", event: "🏆 이벤트 픽", esports: "🎮 e스포츠", money: "💰 머니", health: "🩺 헬스", ott: "📺 OTT·게임", food: "🍜 푸드", culture: "문화", music: "음악", travel: "여행", activity: "주말 액티비티", science: "우주·과학"};
    const cat = series ? series.name : (CAT[(F.match(/_([a-z]+)-brief\.html$/) || [])[1]] || "");
    const wx = !series && main.doc.querySelector(".weather");
    if(wx) wx.querySelector(".wx-note")?.remove();
    const wxt = wx ? clean(wx.textContent).replace(/[—-]\s*$/, "") : "";
    const plain = h => clean(new DOMParser().parseFromString(h.replace(/<br>/g, " "), "text/html").body.textContent);
    const md2 = s => `${Number(s.slice(5, 7))}.${Number(s.slice(8, 10))}`;
    const dateLine = MIX ? mixSpan(MIX, D).map(md2).join("–") : `${m}.${d}`;

    let h = `<div class="rail" id="rail">
      <section class="slide cover${(() => { const hl = clean(series ? series.head : main.doc.querySelector("h1")?.textContent).length;
        return (hl > 26 && (wxt || cards.length >= 5)) || cards.length >= 7 ? " dense" : ""; })()}" aria-label="표지"><div class="in">
        ${cat ? `<div class="cat">${esc(cat)}</div>` : ""}<div class="k">${esc(series ? series.kicker : kicker)}</div>
        <div class="d">${dateLine}<small>${series ? "" : wd}</small></div>
        <h2>${nb(esc(series ? series.head.replace("{n}", cards.length) : clean(main.doc.querySelector("h1")?.textContent)))}</h2>
        ${wxt ? `<div class="wx">${esc(wxt)}</div>` : ""}
        <ol>${cards.slice(0, 8).map((c, i) => `<li><b>${i + 1}</b>${c.ahead ? "<em>미리 예약</em>" : ""}<span>${esc(plain(c.title))}</span></li>`).join("")}</ol>
        <div class="handle">${HANDLE}</div>
      </div></section>`;
    cards.forEach((c, i) => {
      const len = plain(c.title).length;
      const [lab, ...rest] = c.label.split("·").map(clean);
      h += `<section class="slide" aria-label="${i + 1}번 카드" style="--accent:${c.ac};--accent-soft:${c.acs}">
        <div class="stage"><span class="count">${i + 2}/${N}</span>
          ${c.vis || (c.num
            ? `<svg viewBox="0 0 400 250" role="img" aria-label="${esc(c.num)}">${heroT(200, 150, c.num.replace(/\s+/g, ""), "middle")}<text x="200" y="192" text-anchor="middle" class="ig-k">${esc((c.label.split("·")[0] || "").trim())}</text></svg>`
            : `<div class="tile" aria-hidden="true">${esc((c.label.split("·")[0] || "").trim() || "Brief")}<small>${md2(c.date)} ${esc(kicker)}</small></div>`)}
        </div>
        <div class="badge">${i + 1}</div>
        <div class="body">
          <span class="credit">${esc(c.credit)}</span>
          <span class="label"><b>${esc(lab || "")}</b>${rest.length ? " · " + esc(rest.join(" · ")) : ""}</span>
          <h2 class="${len > 34 ? "xl" : len > 24 ? "l" : ""}">${nb(c.title)}</h2>
          <p>${esc(c.sum)}</p>
          <div class="foot"><span class="h">${HANDLE}</span><span>${esc(cat || kicker.toUpperCase())} · ${md2(c.date)}</span></div>
        </div>
      </section>`;
    });
    // 마지막 장: 출처 — 매체 이름과 앱 안내, AI 이미지가 있으면 표시
    h += `<section class="slide cover end" aria-label="출처"><div class="in">
        <div class="k">SOURCES · 출처</div>
        <h2>원문과 전체 브리프는<br>프로필 링크의 앱에서</h2>
        <ol${cards.some(c => (c.credit || "").length > 14) ? ' class="one"' : ""}>${cards.slice(0, 8).map((c, i) => `<li><b>${i + 1}</b><span>${esc(c.credit || "—")}</span></li>`).join("")}</ol>
        <div class="share">📤 도움이 됐다면 친구에게 공유해 주세요</div>
        <div class="follow">${HANDLE}<small>${SPORTS ? "⚾ 매일 밤 야구 · ⚽ 다음 날 아침 축구 · 🏆 빅이벤트" : "월 AI · 화 머니 · 수 OTT · 목 푸드 · 금 주말 · 토 음악 · 일 우주"}</small><small class="xlink">${SPORTS ? "📰 오늘의 뉴스·생활 코너는 @hannun.brief" : "⚾⚽ 야구·축구는 @hannun.sports"}</small></div>
        <div class="wx">각 카드는 기사 내용을 직접 요약하고 도표·지도·개념도를 새로 그렸습니다.${cards.some(c => c.pc) ? " 이미지는 아래 크레디트의 공개 자료입니다." : ""}${cards.some(c => c.ai) ? " 일부 그림은 AI로 생성했습니다." : ""} 수치는 바뀔 수 있어요.${[...new Set(cards.map(c => c.pc).filter(Boolean))].map(x => `<br>${esc(x)}`).join("")}</div>
      </div></section>`;
    h += `</div>
      <div class="nav"><button id="prev" aria-label="이전 카드">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="다음 카드">›</button></div>
      <div class="saves" id="saves" hidden></div>`;
    wrap.innerHTML = h;

    const rail = document.getElementById("rail"), slides = [...rail.children], dots = document.getElementById("dots");
    slides.forEach(() => dots.appendChild(document.createElement("i")));
    const step = () => slides[0].offsetWidth + 14;
    const cur = () => Math.round(rail.scrollLeft / step());
    const paint = () => { const c = cur(); [...dots.children].forEach((x, i) => x.classList.toggle("on", i === c)); };
    rail.addEventListener("scroll", () => requestAnimationFrame(paint), {passive: true});
    const go = k => rail.scrollTo({left: Math.max(0, Math.min(slides.length - 1, cur() + k)) * step(), behavior: "smooth"});
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    addEventListener("keydown", e => { if(e.key === "ArrowRight") go(1); if(e.key === "ArrowLeft") go(-1); });
    paint();
    // 앱 카드 띠에서 누른 장부터 연다(?s=N, 0 = 표지 · 2026-10-22)
    const S0 = Math.max(0, Math.min(slides.length - 1, Number(qs.get("s")) || 0));
    if(S0) requestAnimationFrame(() => { rail.scrollLeft = S0 * step(); paint(); });

    // Actions 가 구운 인스타용 JPG 가 있으면 저장용 목록을 보여 준다
    // 일괄 저장 패널은 관리자 기기에만(2026-10-21): 앱(app/ · 루트 주소 · 이 화면) 주소에 ?admin=1 로 한 번 열면 그 기기에 기억, ?admin=0 으로 끈다.
    // 화면 정리용일 뿐 보안이 아니다 — 카드 JPG 는 공개 주소에 있다.
    const ADMIN = (() => { try { const v = qs.get("admin"); if(v === "1") localStorage.setItem("dcn-admin", "1"); if(v === "0") localStorage.removeItem("dcn-admin");
      return localStorage.getItem("dcn-admin") === "1"; } catch { return qs.get("admin") === "1"; } })();
    if(!PNG && ADMIN){
      const dir = `../cards/${y}-${m}/${MIX ? `${D}_${MIX}` : F.replace(/\.html$/, "")}/`;
      const names = slides.map((_, i) => String(i + 1).padStart(2, "0") + ".jpg");
      fetch(dir + names[0], {method: "HEAD", cache: "no-cache"}).then(r => {
        if(!r.ok) return;
        const s = document.getElementById("saves");
        s.innerHTML = `<h3>인스타용 이미지 ${names.length}장</h3>
          <button class="all" id="saveAll" disabled>이미지 준비 중…</button>
          ${ANDROID ? `<button class="all sub" id="shareAll" disabled>📤 인스타 등으로 바로 공유</button>` : ""}
          <p>${IOS ? `공유 화면에서 <b>'이미지 ${names.length}개 저장'</b>을 누르면 사진에 순서대로 저장돼요.`
            : ANDROID ? `<b>다운로드 폴더</b>에 01~${String(names.length).padStart(2, "0")} 순서로 저장돼요. 처음 한 번 '여러 파일 다운로드 허용'을 물으면 허용해 주세요. 갤러리·인스타 사진 선택 화면의 '다운로드'에서 보여요.`
            : `ZIP 파일 하나로 내려받아요.`} 한 장씩은 길게 눌러 저장. 1080×1350 · 출처는 각 카드 오른쪽 위와 마지막 장에 있어요.</p>
          <div class="g">${names.map(n => `<a href="${dir + n}" target="_blank" rel="noopener"><img src="${dir + n}" loading="lazy" alt="카드 ${esc(n)}"></a>`).join("")}</div>`;
        s.hidden = false;
        // 전체 저장: 미리 받아 두었다가 누르는 즉시 공유 시트(사진 저장) — 공유가 안 되는 기기는 ZIP 으로
        const stem = MIX ? `${D}_${MIX}` : F.replace(/\.html$/, "");
        const btn = document.getElementById("saveAll");
        let files = null;
        Promise.all(names.map(n => fetch(dir + n).then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); })
          .then(b => new File([b], `${stem}_${n}`, {type: "image/jpeg"}))))
          .then(f => { files = f; btn.disabled = false; btn.textContent = ANDROID ? `📥 ${f.length}장 갤러리(다운로드)에 저장` : `📥 ${f.length}장 한 번에 저장`;
            const sh = document.getElementById("shareAll"); if(sh) sh.disabled = !(navigator.canShare && navigator.canShare({files})); })
          .catch(() => { btn.textContent = "이미지를 불러오지 못했어요"; });
        const download = (blob, name) => { const url = URL.createObjectURL(blob), a = document.createElement("a");
          a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000); };
        const share = async () => { try{ await navigator.share({files}); return true; }catch(e){ return !!(e && e.name === "AbortError"); } };
        btn.onclick = async () => {
          if(!files) return;
          // iPhone: 공유 시트의 '이미지 N개 저장' · Android: 파일을 하나씩 다운로드(갤러리 저장 항목이 공유 시트에 없어서) · 그 밖: ZIP
          if(IOS && navigator.canShare && navigator.canShare({files}) && await share()) return;
          if(ANDROID){
            btn.disabled = true;
            for(let i = 0; i < files.length; i++){ btn.textContent = `저장 중… ${i + 1}/${files.length}`; download(files[i], files[i].name); await new Promise(r => setTimeout(r, 450)); }
            btn.textContent = `✅ ${files.length}장 저장 요청 완료 — 다운로드 폴더 확인`; btn.disabled = false; return;
          }
          download(await zipStore(files), `${stem}.zip`);
        };
        const sh = document.getElementById("shareAll"); if(sh) sh.onclick = () => files && share();
      }).catch(() => {});
    }
    await document.fonts.ready;
    document.body.dataset.ready = String(slides.length);
  }catch(err){
    wrap.innerHTML = '<div class="state">카드를 만들지 못했어요.<br>브리프를 열어 읽어 주세요.</div>';
    document.body.dataset.ready = "0";
  }
})();
</script>
</body>
</html>
