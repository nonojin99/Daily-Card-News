<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--stage:#f3f1ea;--card:#fff;--ink:#1a1a18;--muted:#55554f;--faint:#9a9a94;--line:#e6e4dd;--acc:#2f6b45;--acc-s:#e9f1ec;--ucl:#2f6d9e;--uel:#c06a24;--rel:#b8433a;--sans:'Noto Sans KR',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ddd;font-family:var(--sans);color:var(--ink);word-break:keep-all}
.c{width:1080px;height:1350px;background:var(--stage);position:relative;overflow:hidden;padding:64px 72px 56px;display:flex;flex-direction:column}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}
.kick{font:700 22px var(--sans);letter-spacing:.14em;color:var(--acc)}
.ttl{font:900 52px var(--sans);letter-spacing:-.02em;line-height:1.15;margin-top:8px}
.meta{font:500 21px var(--sans);color:var(--muted);text-align:right;line-height:1.5}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:500 19px var(--sans);color:var(--faint);padding-top:16px}
.ft b{color:var(--acc);font-weight:700;font-size:22px}
.lg{display:flex;gap:22px;font:500 18px var(--sans);color:var(--muted)}
.lg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.z1{background:var(--ucl)}.z2{background:var(--uel)}.z3{background:var(--rel)}
/* A 클래식 표 */
.ta{background:var(--card);border-radius:22px;padding:10px 26px;flex:1;display:flex;flex-direction:column}
.ta .r{display:grid;grid-template-columns:8px 50px 1fr 54px 54px 54px 54px 76px 84px;align-items:center;height:48px;border-bottom:1px solid var(--line);font:500 24px var(--sans)}
.ta .r:last-child{border:0}
.ta .h{height:40px;font:700 18px var(--sans);color:var(--faint)}
.ta .bar{width:6px;height:34px;border-radius:3px}
.ta .n{font-weight:700;color:var(--muted);text-align:center}
.ta .t{font-weight:700;padding-left:8px}
.ta .s{text-align:center;color:var(--muted)}
.ta .p{text-align:center;font:900 28px var(--sans)}
.ta .cut{border-bottom:2px dashed var(--faint)}
/* B 2단 */
.tb{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1}
.tb .col{background:var(--card);border-radius:22px;padding:14px 22px;display:flex;flex-direction:column}
.tb .r{display:grid;grid-template-columns:46px 1fr 70px;align-items:center;flex:1;border-bottom:1px solid var(--line)}
.tb .r:last-child{border:0}
.tb .n{font:900 30px var(--sans);color:var(--faint)}
.tb .t{font:700 27px var(--sans)} .tb .t small{display:block;font:500 17px var(--sans);color:var(--faint);margin-top:2px}
.tb .p{font:900 40px var(--sans);text-align:right;letter-spacing:-.02em}
.tb .zt{color:var(--ucl)} .tb .zu{color:var(--uel)} .tb .zr{color:var(--rel)}
/* C 막대 */
.tc{background:var(--card);border-radius:22px;padding:16px 30px;flex:1;display:flex;flex-direction:column}
.tc .r{display:grid;grid-template-columns:44px 170px 1fr;align-items:center;flex:1}
.tc .n{font:700 22px var(--sans);color:var(--faint);text-align:right;padding-right:14px}
.tc .t{font:700 24px var(--sans)}
.tc .bw{position:relative;height:30px}
.tc .b{height:30px;border-radius:0 8px 8px 0;background:#cfcdc4;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font:900 22px var(--sans);color:#fff;min-width:46px}
/* D 구역 그룹 */
.td{flex:1;display:flex;flex-direction:column;gap:14px}
.td .g{background:var(--card);border-radius:20px;padding:10px 24px 8px;border-left:10px solid var(--line)}
.td .gh{display:flex;justify-content:space-between;font:700 19px var(--sans);color:var(--muted);padding:6px 0 4px}
.td .r{display:grid;grid-template-columns:44px 1fr 120px 70px;align-items:center;height:42px;font:500 24px var(--sans);border-top:1px solid var(--line)}
.td .n{font-weight:700;color:var(--faint)} .td .t{font-weight:700}
.td .gap{color:var(--faint);font-size:19px;text-align:right;padding-right:16px}
.td .p{font:900 28px var(--sans);text-align:right}
/* E 승점 사다리 */
.te{background:var(--card);border-radius:22px;flex:1;position:relative;overflow:hidden}
.te .ax{position:absolute;left:30px;top:24px;bottom:24px;width:70px}
.te .tick{position:absolute;left:30px;right:30px;border-top:1px solid var(--line);font:700 22px var(--sans);color:var(--faint)}
.te .tick span{position:absolute;top:-15px;left:0;background:#fff;padding-right:10px}
.te .row{position:absolute;left:100px;display:flex;gap:10px;transform:translateY(-50%)}
.te .chip{font:700 21px var(--sans);padding:7px 14px;border-radius:999px;background:var(--stage);white-space:nowrap}
.te .chip b{color:var(--faint);font-weight:700;margin-right:6px}
</style></head><body>
<div id="root"></div>
<script>
const T=[["맨시티",8,7,0,1,"+11",21],["아스널",8,7,0,1,"+8",21],["브라이턴",8,5,1,2,"+16",16],["리버풀",8,4,3,1,"+3",15],["첼시",8,4,1,3,"+2",13],["브렌트퍼드",8,2,5,1,"+5",11],["리즈",8,2,5,1,"+3",11],["뉴캐슬",8,3,2,3,"−2",11],["애스턴 빌라",8,3,2,3,"−3",11],["헐 시티",8,2,4,2,"+1",10],["에버턴",8,2,4,2,"−1",10],["입스위치",8,3,1,4,"−4",10],["본머스",8,2,3,3,"−1",9],["토트넘",8,2,3,3,"−2",9],["풀럼",8,2,2,4,"−2",8],["맨유",8,1,4,3,"−3",7],["크리스털 팰리스",8,2,1,5,"−10",7],["노팅엄",8,1,3,4,"−4",6],["코번트리",8,2,0,6,"−9",6],["선덜랜드",8,1,2,5,"−8",5]];
const Z=i=>i<4?"ucl":i<5?"uel":i>=17?"rel":"";
const ZC={ucl:"var(--ucl)",uel:"var(--uel)",rel:"var(--rel)","":"transparent"};
const HD=(sub)=>`<div class="hd"><div><div class="kick">⚽ 축구 모닝 · 리더보드</div><div class="ttl">프리미어리그 순위<br>8라운드 뒤</div></div><div class="meta">${sub}</div></div>`;
const LG=`<div class="lg"><span><i class="z1"></i>챔스</span><span><i class="z2"></i>유로파</span><span><i class="z3"></i>강등</span></div>`;
const FT=n=>`<div class="ft">${LG}<span><b>@hannun.sports</b> · 10.30 · 시안 ${n}</span></div>`;
const V={
A:()=>HD("2026-27 시즌<br>10/29 기준")+`<div class="ta"><div class="r h"><span></span><span class="n">#</span><span class="t">팀</span><span class="s">경기</span><span class="s">승</span><span class="s">무</span><span class="s">패</span><span class="s">득실</span><span class="p" style="font-size:18px">승점</span></div>`+T.map((r,i)=>`<div class="r${i==3||i==4||i==16?" cut":""}"><span class="bar" style="background:${ZC[Z(i)]}"></span><span class="n">${i+1}</span><span class="t">${r[0]}</span><span class="s">${r[1]}</span><span class="s">${r[2]}</span><span class="s">${r[3]}</span><span class="s">${r[4]}</span><span class="s">${r[5]}</span><span class="p">${r[6]}</span></div>`).join("")+`</div>`+FT("A · 클래식 표"),
B:()=>HD("1~10위 · 11~20위<br>승점 크게")+`<div class="tb">`+[0,10].map(o=>`<div class="col">`+T.slice(o,o+10).map((r,k)=>{const i=o+k,z=Z(i);return `<div class="r"><span class="n ${z?"z"+z[0]:""}" style="${z?"color:"+ZC[z]:""}">${i+1}</span><span class="t">${r[0]}<small>${r[2]}승 ${r[3]}무 ${r[4]}패 · 득실 ${r[5]}</small></span><span class="p">${r[6]}</span></div>`}).join("")+`</div>`).join("")+`</div>`+FT("B · 2단 분할"),
C:()=>HD("막대 = 승점<br>동률은 득실차 순")+`<div class="tc">`+T.map((r,i)=>`<div class="r"><span class="n">${i+1}</span><span class="t">${r[0]}</span><div class="bw"><div class="b" style="width:${r[6]/21*100}%;background:${Z(i)?ZC[Z(i)]:"#bdbab0"}">${r[6]}</div></div></div>`).join("")+`</div>`+FT("C · 승점 막대"),
D:()=>HD("구역별 묶음<br>오른쪽 = 선두와 차")+`<div class="td">`+[["챔피언스리그권 1~4위","ucl",0,4],["유로파 5위","uel",4,5],["중위권 6~17위","",5,17],["강등권 18~20위","rel",17,20]].map(([h,z,a,b])=>`<div class="g" style="border-left-color:${z?ZC[z]:"var(--line)"}"><div class="gh"><span>${h}</span><span>선두와 · 승점</span></div>`+T.slice(a,b).map((r,k)=>`<div class="r" style="${b-a>8?"height:36px;font-size:22px":""}"><span class="n">${a+k+1}</span><span class="t">${r[0]}</span><span class="gap">${a+k? (21-r[6]?"−"+(21-r[6]):"동률"):"선두"}</span><span class="p" style="${b-a>8?"font-size:25px":""}">${r[6]}</span></div>`).join("")+`</div>`).join("")+`</div>`+FT("D · 구역 그룹"),
E:()=>{const pts=[...new Set(T.map(r=>r[6]))];const max=21,min=5,H=960;const y=p=>24+(max-p)/(max-min)*(H-60);
return HD("세로 = 승점<br>같은 줄 = 동률")+`<div class="te">`+Array.from({length:max-min+1},(_,k)=>max-k).filter(p=>pts.includes(p)).map(p=>`<div class="tick" style="top:${y(p)+20}px"><span>${p}</span></div><div class="row" style="top:${y(p)+20}px">`+T.map((r,i)=>[r,i]).filter(([r])=>r[6]==p).map(([r,i])=>`<span class="chip" style="${Z(i)?"background:"+ZC[Z(i)]+";color:#fff":""}"><b style="${Z(i)?"color:rgba(255,255,255,.75)":""}">${i+1}</b>${r[0]}</span>`).join("")+`</div>`).join("")+`</div>`+FT("E · 승점 사다리")}};
const v=new URLSearchParams(location.search).get("v")||"A";
document.getElementById("root").innerHTML=`<div class="c">${V[v]()}</div>`;
</script></body></html>
