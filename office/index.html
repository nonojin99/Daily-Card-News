<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한눈 브리프 사무실</title>
<meta property="og:title" content="한눈 브리프 사무실 — AI 사무원들이 카드뉴스를 만드는 중">
<meta property="og:description" content="취재·편집·검수·녹음·인쇄·홍보까지, 매일 카드뉴스와 인스타 게시가 진행되는 모습을 실시간으로.">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2b28;--muted:#6b675e;--line:#e7e0d4;--bg:#fbf7f1;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
header{max-width:1400px;margin:0 auto;padding:18px 16px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#c0392b;margin-left:8px;vertical-align:middle}
.live i{width:8px;height:8px;border-radius:50%;background:#e74c3c;animation:blink 1.4s infinite}
.live.replay{color:#6b3f8a}.live.replay i{background:#8e5cc0}
@keyframes blink{50%{opacity:.25}}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.stats b{font-weight:900}
.clock{margin-left:auto;font-size:13px;color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:980px){main{grid-template-columns:1fr}}
.stage{position:relative;width:100%;aspect-ratio:1376/768;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.who{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:left .9s ease,top .9s ease;z-index:2}
.who img{height:calc(var(--sw)*0.085);display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.who.rest img{height:calc(var(--sw)*0.07)}
.who.work img{animation:bob 1.2s ease-in-out infinite}
.who.cheer img{animation:hop .7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes hop{50%{transform:translateY(-6px)}}
.tag{font-size:calc(var(--sw)*0.0085 + 3px);font-weight:900;color:#fff;border-radius:99px;padding:1px 8px;white-space:nowrap;margin-top:-4px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.bubble{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-30%);background:#fff;border:2px solid var(--ink);border-radius:12px;
  padding:3px 9px;font-size:calc(var(--sw)*0.0085 + 3px);font-weight:700;white-space:nowrap;max-width:none}
.bubble:after{content:"";position:absolute;left:24%;bottom:-8px;border:6px solid transparent;border-top-color:var(--ink)}
.bubble.fail{border-color:#c0392b;color:#c0392b}.bubble.fail:after{border-top-color:#c0392b}
.who.rest .bubble{display:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box h2{margin:0 0 8px;font-size:14px;font-weight:900}
.sched li{list-style:none;display:flex;gap:8px;font-size:13px;padding:3px 0;color:var(--muted)}
.sched ul{margin:0;padding:0}.sched li.done{color:var(--ink)}.sched li.done b:after{content:" ✓";color:#2e9e5b}
.sched li.off{opacity:.45}
.log{max-height:430px;overflow:auto;margin:0;padding:0}
.log li{list-style:none;font-size:12.5px;line-height:1.5;padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:42px 1fr;gap:6px}
.log li time{color:var(--muted);font-variant-numeric:tabular-nums}
.log li a{color:inherit;text-decoration:none}.log li a:hover{text-decoration:underline}
.log .d{font-weight:900}
.log .est{color:var(--muted);font-size:11px}
.replaybar{max-width:1400px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:10px;font-size:13px}
.replaybar input{flex:1}
.replaybar button{font:700 13px 'Noto Sans KR';border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;cursor:pointer}
.note{font-size:11.5px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>한눈 브리프 사무실<span class="live" id="live"><i></i>LIVE</span></h1>
  <div class="stats" id="stats"></div>
  <div class="clock" id="clock"></div>
</header>
<div class="replaybar">
  <button id="play">▶ 오늘 다시보기</button>
  <input type="range" id="t" min="0" max="1440" step="1" value="1440" aria-label="시각">
  <button id="now">지금</button>
</div>
<main>
  <div class="stage" id="stage"><img class="bg" src="art/out/pastel-office-a.jpg" alt="파스텔 톤 사무실 그림 (AI 생성)"></div>
  <aside class="side">
    <div class="box sched"><h2>오늘 일정</h2><ul id="sched"></ul></div>
    <div class="box"><h2>활동 로그</h2><ul class="log" id="log"></ul></div>
    <p class="note">GitHub 저장소의 커밋과 Actions 기록으로 움직입니다. 루틴 세션(취재·편집·검수)은 발행 커밋 시각에서 거꾸로 잡은 <b>추정 구간</b>입니다. 사무실 그림·사무원은 AI 생성 이미지.<br><a href="../app/">앱으로 가기</a></p>
  </aside>
</main>
<script>
const REPO = "nonojin99/Daily-Card-News";
// 부서: 자리(그림 위 %, 사무원 발 위치) · 색 · 이름
const DEPTS = {
  research:{name:"취재팀",   color:"#2f6d9e", at:[16.5,55]},
  edit:    {name:"편집팀",   color:"#3d5a4c", at:[32,62]},
  plus:    {name:"서브플러스",color:"#8a6d1f", at:[29,39]},
  review:  {name:"검수팀",   color:"#b5523b", at:[43,52]},
  voice:   {name:"녹음실",   color:"#6b3f8a", at:[41.5,33]},
  art:     {name:"화실",     color:"#c06a24", at:[52.5,29]},
  print:   {name:"인쇄실",   color:"#5f6b73", at:[63.5,33]},
  reel:    {name:"릴스 편집", color:"#2a8a83", at:[69,46]},
  pr:      {name:"홍보팀",   color:"#c2457a", at:[58.5,60]},
  sports:  {name:"스포츠국", color:"#1f5f8b", at:[86,52]}
};
const LOUNGE = [[52,79],[60,88],[45,87],[66,80],[73,71],[58,71],[38,83],[69,90],[52,93],[78,64]];
const RUN_MAP = {"Publish to Instagram":"pr","Publish evening reels":"pr","Instagram insights":"pr","Score alert":"sports","Office art":"art","Pull briefs from Drive":"edit"};
const STEP_MAP = [[/Make audio \(Google/,"voice","낭독 녹음"],[/card illustrations/,"art","AI 일러스트"],[/card images/,"print","카드 굽기"],[/audio reels/,"reel","릴스 편집"]];
const RUN_TEXT = {"Publish to Instagram":"인스타 게시","Publish evening reels":"저녁 릴스 게시","Instagram insights":"성과 수집","Score alert":"경기 결과 알림","Office art":"사무실 그림","Pull briefs from Drive":"Drive 발행함 가져오기"};
const SCHED = [["06:00","메인 브리프",/^\d{4}-\d{2}-\d{2} daily/],["08:30","축구 모닝",/축구|football/i],["09:30","서브플러스",/서브 ?플러스|money|health|ott|food/i],["21:07","저녁 릴스","run:Publish evening reels"],["23:30","야구 나이트",/야구|baseball/i]];
const M = 60e3, KST = 9*60*M;
const kstDay = ms => new Date(ms + KST).toISOString().slice(0,10);
const hhmm = ms => new Date(ms + KST).toISOString().slice(11,16);
const dayStart = ms => Date.parse(kstDay(ms) + "T00:00:00+09:00");

// ── GitHub 읽기 (ETag 로 304 를 받으면 요청 한도를 쓰지 않는다) ──
const etags = {}, bodies = {};
async function gh(path){
  const h = {Accept:"application/vnd.github+json"}; if(etags[path]) h["If-None-Match"] = etags[path];
  const r = await fetch("https://api.github.com/repos/" + REPO + path, {headers:h});
  if(r.status === 304) return bodies[path];
  if(!r.ok) throw new Error(r.status + " " + path);
  etags[path] = r.headers.get("ETag"); return bodies[path] = await r.json();
}
const jobCache = (() => { try{ return JSON.parse(localStorage.getItem("office-jobs") || "{}") }catch(e){ return {} } })();
async function stepsOf(run){
  if(jobCache[run.id]) return jobCache[run.id];
  const j = await gh(`/actions/runs/${run.id}/jobs`);
  const steps = (j.jobs || []).flatMap(x => x.steps || []).map(s => ({n:s.name, st:s.status, c:s.conclusion, a:s.started_at, b:s.completed_at}));
  if(run.status === "completed"){ jobCache[run.id] = steps; try{ localStorage.setItem("office-jobs", JSON.stringify(jobCache)) }catch(e){} }
  return steps;
}

let ACTS = [], LOGS = [];
async function load(){
  const since = Date.now() - 30*3600e3;
  const [runs, commits] = await Promise.all([gh("/actions/runs?per_page=50"), gh("/commits?per_page=60")]);
  const acts = [], logs = [];
  for(const run of (runs.workflow_runs || [])){
    const a = Date.parse(run.run_started_at || run.created_at); if(a < since) continue;
    const b = run.status === "completed" ? Date.parse(run.updated_at) : null;
    const ok = run.status !== "completed" ? "running" : run.conclusion === "success" ? "success" : run.conclusion === "skipped" || run.conclusion === "cancelled" ? "skip" : "failure";
    if(ok === "skip") continue;
    if(run.name === "Build manifest"){
      let steps = [];
      try{ steps = await stepsOf(run) }catch(e){ /* 한도 초과 등 — 묶음 하나로 */ }
      let any = false;
      for(const s of steps){
        const m = STEP_MAP.find(([re]) => re.test(s.n)); if(!m || s.c === "skipped" || !s.a) continue;
        const sa = Date.parse(s.a), sb = s.b ? Date.parse(s.b) : null;
        if(sb && sb - sa < 4000) continue;   // 할 일 없이 지나간 단계
        any = true;
        acts.push({d:m[1], a:sa, b:sb, ok:s.st !== "completed" ? "running" : s.c === "success" ? "success" : "failure", text:m[2], url:run.html_url});
      }
      if(!any) acts.push({d:"print", a, b, ok, text:"카드·manifest 정리", url:run.html_url});
      continue;
    }
    const d = RUN_MAP[run.name]; if(!d) continue;
    acts.push({d, a, b, ok, text:RUN_TEXT[run.name] || run.name, url:run.html_url});
  }
  for(const c of commits){
    const t = Date.parse(c.commit.author.date); if(t < since) continue;
    const msg = c.commit.message.split("\n")[0], bot = /\[bot\]/.test(c.commit.author.name), url = c.html_url;
    if(bot){
      if(/결과 알림/.test(msg)) acts.push({d:"sports", a:t - 2*M, b:t, ok:"success", text:"경기 결과 카드", url});
      continue;
    }
    if(/^Merge /.test(msg)) continue;
    let team = null, label = "";
    if(/^\d{4}-\d{2}-\d{2} daily/.test(msg)){ team = "main"; label = "메인 브리프" }
    else if(/야구|baseball/i.test(msg)){ team = "sports"; label = "야구 나이트" }
    else if(/축구|football/i.test(msg) && /브리프|brief/.test(msg)){ team = "sports"; label = "축구 모닝" }
    else if(/서브 ?플러스|(money|health|ott|food)[ -]brief/i.test(msg)){ team = "plus"; label = "서브플러스" }
    if(team === "main"){
      acts.push({d:"research", a:t - 45*M, b:t - 28*M, ok:"success", text:"기사 찾기·본문 확인", url, est:1});
      acts.push({d:"edit", a:t - 30*M, b:t - 10*M, ok:"success", text:"브리프·카드 작성", url, est:1});
      acts.push({d:"review", a:t - 14*M, b:t, ok:"success", text:"검수·카드 검토 통과", url, est:1});
    } else if(team){
      acts.push({d:team, a:t - 30*M, b:t, ok:"success", text:label + " 작성", url, est:1});
    } else {
      logs.push({t, d:null, text:"🛠 사무실 개선 · " + msg.slice(0, 60), url});
    }
    if(team) logs.push({t, d:team === "main" ? "edit" : team, text:label + " 발행 · " + msg.slice(0, 50), url});
  }
  for(const x of acts) logs.push({t:x.a, d:x.d, text:x.text + (x.ok === "running" ? " 시작" : x.ok === "failure" ? " 실패" : ""), url:x.url, est:x.est});
  ACTS = acts; LOGS = logs.sort((p, q) => q.t - p.t);
  window.RUNS = runs.workflow_runs || []; window.COMMITS = commits;
}

// ── 어느 시각의 부서 상태 ──
function stateAt(t){
  const out = {};
  for(const d in DEPTS){
    const mine = ACTS.filter(x => x.d === d && x.a <= t);
    const cur = mine.filter(x => (x.b === null || x.b > t)).sort((p, q) => q.a - p.a)[0];
    const last = mine.filter(x => x.b !== null && x.b <= t).sort((p, q) => q.b - p.b)[0];
    if(cur && (x => x.ok === "running" || x.b > t)(cur)) out[d] = {s:"work", text:cur.text + (cur.est ? "" : "…"), url:cur.url};
    else if(last && last.ok === "failure" && t - last.b < 6*3600e3) out[d] = {s:"fail", text:last.text + " 실패", url:last.url};
    else if(last && t - last.b < 20*M) out[d] = {s:"cheer", text:last.text + " 완료", url:last.url};
    else out[d] = {s:"rest", text:"휴식", url:last && last.url};
  }
  return out;
}
const stage = document.getElementById("stage"), people = {};
function draw(t){
  const st = stateAt(t); let lounge = 0;
  stage.style.setProperty("--sw", stage.clientWidth + "px");
  for(const d in DEPTS){
    const D = DEPTS[d], S = st[d];
    let el = people[d];
    if(!el){ el = document.createElement("div"); el.className = "who"; el.innerHTML = `<div class="bubble"></div><img alt=""><span class="tag" style="background:${D.color}">${D.name}</span>`;
      el.onclick = () => el.dataset.url && open(el.dataset.url, "_blank"); stage.appendChild(el); people[d] = el; }
    const at = S.s === "rest" ? LOUNGE[lounge++ % LOUNGE.length] : D.at;
    el.style.left = at[0] + "%"; el.style.top = at[1] + "%"; el.style.zIndex = Math.round(at[1]);
    el.className = "who " + S.s;
    const img = el.querySelector("img"), src = `sprites/${S.s}.png`; if(!img.src.endsWith(src)) img.src = src;
    img.alt = D.name + " " + S.text;
    const b = el.querySelector(".bubble"); b.textContent = S.text; b.className = "bubble" + (S.s === "fail" ? " fail" : "");
    el.dataset.url = S.url || "";
  }
  const n = s => Object.values(st).filter(x => x.s === s).length;
  document.getElementById("stats").innerHTML = `<span>일하는 중 <b>${n("work")}</b></span><span>방금 끝냄 <b>${n("cheer")}</b></span><span>실패 <b style="color:#c0392b">${n("fail")}</b></span><span>쉬는 중 <b>${n("rest")}</b></span>`;
  const today = dayStart(t);
  document.getElementById("sched").innerHTML = SCHED.map(([tm, name, rule]) => {
    const due = Date.parse(kstDay(t) + "T" + tm + ":00+09:00");
    let done = false;
    if(typeof rule === "string"){ const nm = rule.slice(4); done = (window.RUNS || []).some(r => r.name === nm && r.conclusion === "success" && Date.parse(r.created_at) >= today && Date.parse(r.updated_at) <= t) }
    else done = (window.COMMITS || []).some(c => !/\[bot\]/.test(c.commit.author.name) && rule.test(c.commit.message.split("\n")[0]) && Date.parse(c.commit.author.date) >= today - 3*3600e3 && Date.parse(c.commit.author.date) <= t && kstDay(Date.parse(c.commit.author.date)) === kstDay(t));
    return `<li class="${done ? "done" : t > due + 3*3600e3 ? "off" : ""}"><b>${tm}</b>${name}</li>`;
  }).join("");
  document.getElementById("log").innerHTML = LOGS.filter(x => x.t <= t).slice(0, 60).map(x =>
    `<li><time>${hhmm(x.t)}</time><a href="${x.url || "#"}" target="_blank" rel="noopener">${x.d ? `<span class="d" style="color:${DEPTS[x.d].color}">${DEPTS[x.d].name}</span> ` : ""}${x.text}${x.est ? ' <span class="est">추정</span>' : ""}</a></li>`).join("") || "<li>기록 없음</li>";
  document.getElementById("clock").textContent = (T === null ? "지금 " : "다시보기 ") + kstDay(t) + " " + hhmm(t) + " KST";
}

// ── 지금 / 다시보기 ──
let T = null, timer = null;
const slider = document.getElementById("t"), live = document.getElementById("live");
function nowMin(){ return Math.round((Date.now() - dayStart(Date.now())) / M) }
function setLive(){ T = null; clearInterval(timer); timer = null; slider.value = nowMin(); live.className = "live"; live.lastChild.textContent = "LIVE"; document.getElementById("play").textContent = "▶ 오늘 다시보기"; draw(Date.now()) }
slider.oninput = () => { T = dayStart(Date.now()) + slider.value * M; live.className = "live replay"; live.lastChild.textContent = "다시보기"; draw(Math.min(T, Date.now())) };
document.getElementById("now").onclick = setLive;
document.getElementById("play").onclick = e => {
  if(timer){ clearInterval(timer); timer = null; e.target.textContent = "▶ 이어 보기"; return }
  if(T === null || slider.value >= nowMin()) slider.value = 300;
  e.target.textContent = "⏸ 멈춤";
  timer = setInterval(() => { slider.value = +slider.value + 3; if(+slider.value >= nowMin()){ setLive(); return } slider.oninput() }, 120);
};
addEventListener("resize", () => draw(T === null ? Date.now() : T));
(async function tick(){
  try{ await load() }catch(e){ document.getElementById("log").innerHTML = `<li>GitHub 기록을 읽지 못했어요 (${e.message}) — 잠시 뒤 다시 시도합니다</li>` }
  if(T === null){ slider.max = 1440; slider.value = nowMin(); draw(Date.now()) } else draw(T);
  setTimeout(tick, 120e3);
})();
</script>
</body>
</html>
